name: release

on:
  push:
    tags:
      - 'SleemOS-*'

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            SleemOS.bin
            SleemOS.elf

  host-tool:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: build sleemfsdk
        shell: bash
        run: g++ -O2 sleemfsdk/sleemfsdk.cpp -o sleemfsdk.exe
      - uses: actions/upload-artifact@v4
        with:
          name: hosttool
          path: sleemfsdk.exe

  release:
    needs: [firmware, host-tool]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/SleemOS.bin
            dist/SleemOS.elf
            dist/sleemfsdk.exe
