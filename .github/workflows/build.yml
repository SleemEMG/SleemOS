name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: build
        run: make
      - name: size
        run: arm-none-eabi-size SleemOS.elf
      - uses: actions/upload-artifact@v4
        with:
          name: SleemOS-bin
          path: SleemOS.bin

  host-tool:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: build sleemfsdk
        shell: bash
        run: g++ -O2 bfstools/sleemfsdk.cpp -o sleemfsdk.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sleemfsdk-exe
          path: sleemfsdk.exe
